# Gradle JVM args
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Gradle
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# KSP (KSP2 incompatible with Hilt 2.52 — use KSP1)
ksp.useKSP2=false

# Allow non-ASCII project path (E:\软件工程项目\ contains CJK chars)
android.overridePathCheck=true

# R8 full mode（更激进的代码优化与混淆，符合 v4.0.7 release 强化要求）
android.enableR8.fullMode=true
